services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: geov4
      MYSQL_USER: geov4
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck: { test: [CMD, mysqladmin, ping, -h, localhost], interval: 10s, timeout: 5s, retries: 12 }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3100
      DATABASE_URL: mysql://geov4:${MYSQL_PASSWORD}@mysql:3306/geov4
      RUN_MIGRATIONS: "true"
      MIGRATIONS_DIR: ./drizzle
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    depends_on: { mysql: { condition: service_healthy } }
    healthcheck: { test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)})"], interval: 10s, timeout: 5s, retries: 12 }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: { api: { condition: service_healthy } }
volumes:
  mysql_data:
